<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Clinic — Location</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; padding: 0; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 12px 0; font-size: 1.5rem; }
    .map-wrap { position: relative; width: 100%; padding-bottom: 56.25%; /* 16:9 */ }
    .map-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .links { margin-top: 12px; }
    .links a { color: #1a73e8; text-decoration: none; margin-right: 12px; }
    .note { margin-top: 8px; color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our location — Wilson Street, Titanic Plaza</h1>

    <div class="map-wrap">
      <!-- Embedded map pointed at Wilson Street Titanic Plaza -->
      <iframe
        title="Wilson Street Titanic Plaza — Google Maps"
        loading="lazy"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=Wilson+Street+Titanic+Plaza&output=embed">
      </iframe>
    </div>

    <div class="links">
      <a href="https://www.google.com/maps/search/?api=1&query=Wilson+Street+Titanic+Plaza" target="_blank" rel="noopener">View on Google Maps</a>
      <a href="https://www.google.com/maps/dir/?api=1&destination=Wilson+Street+Titanic+Plaza" target="_blank" rel="noopener">Get directions</a>
      <a href="https://search.google.com/local/writereview?placeid=" target="_blank" rel="noopener">Write a review on Google</a>
    </div>

    <p class="note">If the map does not show correctly in your environment, click "View on Google Maps" to open the location directly on Google Maps.</p>
  </div>
</body>
</html>
